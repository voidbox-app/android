name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a vault on …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Voidbox version
      description: The release you installed, e.g. 1.0.4.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: Cloud
      options:
        - Nextcloud
        - Other WebDAV
        - S3
        - Local storage
        - Not related to a cloud
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Settings → Debug mode, reproduce the problem, then Send log file. Remove anything private first.
