name: Release

# Builds the Latch APK (the Cryptomator lite flavor with the Latch changes) from master and
# publishes it as a GitHub release named after VERSION, with its SHA-256 checksum.
#
# Actions -> Release -> Run workflow. A release whose tag already exists is not rebuilt: bump
# VERSION first. The workflow never changes the branch; RELEASING.md describes the whole
# process, including how Cryptomator updates are taken over.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$(tr -d '[:space:]' < UPSTREAM_TAG)" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$version already exists; bump VERSION to publish a new build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build lite release APK
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon :presentation:assembleLiteRelease

      - name: Sign APK
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LATCH_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > latch.jks
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls presentation/build/outputs/apk/lite/release/*.apk | head -1)
          "$tools/apksigner" sign --ks latch.jks --ks-key-alias latch \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "latch-${{ steps.version.outputs.version }}.apk" "$unsigned"
          "$tools/apksigner" verify --print-certs "latch-${{ steps.version.outputs.version }}.apk"
          sha256sum "latch-${{ steps.version.outputs.version }}.apk" > "latch-${{ steps.version.outputs.version }}.apk.sha256"
          rm -f latch.jks

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          upstream="${{ steps.version.outputs.upstream }}"
          prerelease=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "v$version" "latch-$version.apk" "latch-$version.apk.sha256" --repo "$GITHUB_REPOSITORY" $prerelease \
            --title "Latch $version" \
            --notes "Latch $version, built on Cryptomator $upstream: https://github.com/cryptomator/android/releases/tag/$upstream"
