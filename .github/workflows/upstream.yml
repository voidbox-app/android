name: Upstream merge

# Brings a Cryptomator release into Latch: merges the cryptomator/android tag into a new branch
# `upstream/<tag>`, records the tag in UPSTREAM_TAG, checks that the result passes the unit
# tests and builds, and opens a pull request into master. Latch follows Cryptomator by merging
# only; the history of master is never rewritten.
#
# Actions -> Upstream merge -> Run workflow, with the Cryptomator tag (e.g. 1.13.0). A merge
# conflict fails the job: merge the tag locally on such a branch and open the pull request by hand.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "cryptomator/android tag to merge"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge the upstream tag
        id: merge
        run: |
          case "$TAG" in
            *[!0-9A-Za-z._-]*|"") echo "not a tag name: $TAG"; exit 1 ;;
          esac
          if [ "$(tr -d '[:space:]' < UPSTREAM_TAG)" = "$TAG" ]; then
            echo "Latch is already based on Cryptomator $TAG"
            exit 1
          fi
          git config user.name "latch-ci"
          git config user.email "latch-ci@users.noreply.github.com"
          git remote add upstream https://github.com/cryptomator/android.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          branch="upstream/$TAG"
          git switch -c "$branch"
          git merge --no-ff --no-edit -m "Merge Cryptomator $TAG" "$TAG"
          echo "$TAG" > UPSTREAM_TAG
          git commit -am "Record Cryptomator $TAG as the upstream base"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # a pull request opened with the workflow token does not start CI, so the checks run here
      - name: Unit tests and build
        run: ./gradlew --no-daemon :domain:testLiteDebugUnitTest :data:testLiteDebugUnitTest :presentation:testLiteDebugUnitTest :util:testLiteDebugUnitTest :presentation:assembleLiteDebug

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --title "Merge Cryptomator $TAG" \
            --body "Merges [Cryptomator $TAG](https://github.com/cryptomator/android/releases/tag/$TAG) into Latch. Unit tests and the debug build passed in the workflow run." \
            || echo "Could not open the pull request (Settings -> Actions -> allow GitHub Actions to create pull requests); open it here: https://github.com/$GITHUB_REPOSITORY/compare/master...$BRANCH"
